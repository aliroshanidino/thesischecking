- config: configs/phase0_eth80.yaml
  seeds: &id001
  - 0
  set:
  - validation.instances=1
  - data.size=200
  - retina.threshold=15
  - n_layers=3
  - layers.2.maps=800
  - layers.2.k=800
  - learning.max_iter=[8000, 30000]
  - 'layers.2.homeostasis={eta: 0.5, rho: 0.2}'
  - 'readout.variants=[{grid: 4, layers: [2], standardize: true}, {grid: 3, layers:
    [2], standardize: true}, {grid: 4, layers: [2], standardize: true, flip: true},
    {grid: 3, layers: [2], standardize: true, flip: true}, {grid: 4, layers: [2],
    standardize: true, flip: true, C: auto}]'
  - retina.dog_kernels=[[7, 1.0, 2.0], [7, 2.0, 1.0]]
  name: s1_on_off
