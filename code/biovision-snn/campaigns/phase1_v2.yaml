# Phase 1, version 2 (user, 2026-10-20 13:00; DECISIONS D28): local contrast normalisation in the retina (contrast gain
# control: each response divided by kappa x luminance + the local contrast energy of its channel, a binomial pool
# n = 36; a subtraction in the log domain) instead of per-image thresholds, plus accuracy levers (mirrored training
# images for R-STDP, 150 epochs as Mozafari, 24 S1 maps; a twice wider V4 / IT for the classifier front).
# ETH-80 validation screen with the invariance tests (all 328 validation images).
name: phase1_v2
slots: 3
max_jobs: 3
stages:
  - name: screen
    defaults: {seeds: [0], set: [validation.instances=1, "invariance={brightness: [0.25, 0.5, 2, 4], gamma: [0.5, 2], scale: [0.7, 0.85, 1.2, 1.4], shift: [4, 8, 16], n_test: 400}"]}
    runs:
      - {name: r2_lcn7, config: configs/phase1_eth80_rlc1.yaml, set: ["rstdp.calcium={lam: 0.9}", "retina.filters={lcn: 36, kappa: 0.0078125}"]}
      - {name: r2_lcn7_flip150, config: configs/phase1_eth80_rlc1.yaml, set: ["rstdp.calcium={lam: 0.9}", "retina.filters={lcn: 36, kappa: 0.0078125}", rstdp.flip=true, rstdp.epochs=150]}
      - {name: s2_lcn7, config: configs/phase1_eth80.yaml, set: [retina.channels=pkm, "retina.filters={lcn: 36, kappa: 0.0078125}", "readout.variants=[{grid: 4, layers: [4, 6], standardize: true}, {grid: 4, layers: [4, 6], standardize: true, flip: true}]"]}
      - {name: r2_lcn5, config: configs/phase1_eth80_rlc1.yaml, set: ["rstdp.calcium={lam: 0.9}", "retina.filters={lcn: 36, kappa: 0.03125}"]}
      - {name: r2_lcn7_s24_flip150, config: configs/phase1_eth80_rlc1s24.yaml, set: ["rstdp.calcium={lam: 0.9}", "retina.filters={lcn: 36, kappa: 0.0078125}", rstdp.flip=true, rstdp.epochs=150]}
      - {name: s2_lcn7_big, config: configs/phase1_eth80_big.yaml, set: [retina.channels=pkm, "retina.filters={lcn: 36, kappa: 0.0078125}", "readout.variants=[{grid: 4, layers: [4, 6], standardize: true}, {grid: 4, layers: [4, 6], standardize: true, flip: true}]"]}
      - {name: s2_base, config: configs/phase1_eth80.yaml, set: [retina.channels=pkm, "readout.variants=[{grid: 4, layers: [4, 6], standardize: true}, {grid: 4, layers: [4, 6], standardize: true, flip: true}]"]}
