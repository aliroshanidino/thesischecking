# Replication of Kheradpisheh et al. 2016 on ETH-80 (5/5 split, test): fixed Gabor S1/C1, 5 scales with shared S2
# weights, 1250 S2 maps (the paper's best feature count), learning-rate schedule 2^-6 -> 2^-2 and 600 learning
# spikes per map, global max over positions and scales, one-versus-one linear SVM. Deviation (compute): up to 8
# learning winners per scale view instead of 2 (DECISIONS D21).
name: eth80_2016
slots: 1
max_jobs: 3
stages:
  - name: replicate
    runs:
      - name: s2_1250
        config: configs/phase0_eth80_multiscale.yaml
        seeds: [0]
        set:
          - layers.0.maps=1250
          - "learning.max_iter=[150000]"
          - "readout.variants=[{grid: 1, layers: [0], svm: ovo}, {grid: 1, layers: [0]}, {grid: 3, layers: [0], standardize: true}, {grid: 3, layers: [0], standardize: true, knn: 5}]"
