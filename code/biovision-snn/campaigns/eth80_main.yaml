# ETH-80 campaign (reports/phase0/plan_fa.md): screen on validation (1 held-out training object per class),
# confirm the top 3 of ALL screening rounds (this one, eth80_screen2, eth80_screen3) on a second split, then test
# the winner with both paper protocols (5/5 split x 3 seeds, leave-one-object-out x 10 folds).
name: eth80_main
slots: 2
max_jobs: 2   # classifier front: leaves one GPU slot to the RL front (main), RAM-limited to 3 jobs
stages:
  - name: screen
    defaults:
      config: configs/phase0_eth80.yaml
      seeds: [0]
      set:
        - validation.instances=1
        - data.size=200
        - retina.threshold=15
        - n_layers=3
        - "learning.max_iter=[8000, 30000]"
        - "layers.2.homeostasis={eta: 0.5, rho: 0.2}"
        - "readout.variants=[{grid: 4, layers: [2], standardize: true}, {grid: 3, layers: [2], standardize: true}, {grid: 5, layers: [2], standardize: true}, {grid: 4, layers: [2], standardize: true, C: auto}]"
    runs:
      - {name: e0_ref}
      - {name: e1_maps800, set: [layers.2.maps=800, layers.2.k=800]}
      - {name: e2_hasizh, set: ["layers.2.homeostasis={alpha: 0.015625, gamma: 0.5}"]}
      - {name: e3_hasizh_brake, set: ["layers.2.homeostasis={alpha: 0.015625, gamma: 0.5, brake: 2.0}"]}
      - {name: e4_sdsp, set: ["layers.2.homeostasis={alpha: 0.015625, gamma: 0.5}", layers.2.rule=sdsp,
                              "layers.2.sdsp={kappa: 0.0, silent_ltd: true, ca_up: 0.35, ca_down: 0.02}"]}
      - {name: e5_sdsp_k03, set: ["layers.2.homeostasis={alpha: 0.015625, gamma: 0.5}", layers.2.rule=sdsp,
                                  "layers.2.sdsp={kappa: 0.3, silent_ltd: true, ca_up: 0.35, ca_down: 0.02}"]}
      - {name: e6_size300, set: [data.size=300]}
  - name: confirm
    wait_for: [eth80_screen2, eth80_screen3]
    from: [screen, eth80_screen2/screen, eth80_screen3/screen]
    top: 3
    seeds: [1]
    keep_variant: false
  - name: final55
    from: confirm
    pool: [screen, eth80_screen2/screen, eth80_screen3/screen]
    top: 1
    drop: [validation.]
    final_C: auto
    seeds: [0, 1, 2]
