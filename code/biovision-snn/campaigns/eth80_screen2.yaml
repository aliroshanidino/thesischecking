# ETH-80 second screening round (validation, 1 held-out training object per class): ideas beyond the papers on top
# of the 800-map conv2 (best of round 1 so far). The winner is compared with eth80_main's selection before the final.
name: eth80_screen2
slots: 1
max_jobs: 2   # classifier front: leaves one GPU slot to the RL front (main), RAM-limited to 3 jobs
stages:
  - name: screen
    defaults:
      config: configs/phase0_eth80.yaml
      seeds: [0]
      set:
        - validation.instances=1
        - data.size=200
        - retina.threshold=15
        - n_layers=3
        - layers.2.maps=800
        - layers.2.k=800
        - "learning.max_iter=[8000, 30000]"
        - "layers.2.homeostasis={eta: 0.5, rho: 0.2}"
        - "readout.variants=[{grid: 4, layers: [2], standardize: true}, {grid: 3, layers: [2], standardize: true}, {grid: 4, layers: [2], standardize: true, flip: true}, {grid: 3, layers: [2], standardize: true, flip: true}, {grid: 4, layers: [2], standardize: true, flip: true, C: auto}]"
    runs:
      - {name: s1_on_off, set: ["retina.dog_kernels=[[7, 1.0, 2.0], [7, 2.0, 1.0]]"]}
      - {name: s2_scales3, set: ["retina.scales=[1.0, 0.71, 0.5]"]}
      - {name: s3_maps1200, set: [layers.2.maps=1200, layers.2.k=1200]}
      - {name: s4_on_off_scales3, set: ["retina.dog_kernels=[[7, 1.0, 2.0], [7, 2.0, 1.0]]", "retina.scales=[1.0, 0.71, 0.5]"]}
